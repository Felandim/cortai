# CI: detector JS vs Python + e2e headless (Chromium). Não publica nada (sem GitHub Pages).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ffmpeg + numpy (referência Python)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy
      - name: npm install (ffmpeg.wasm fixo)
        run: npm install --no-audit --no-fund
      - name: Fixtures + janelas do Python
        run: python3 tests/make_fixtures.py
      - name: Teste do detector (JS vs Python)
        run: node tests/detector.test.mjs
      - name: Build do site
        run: bash tools/build-site.sh _site
      - name: E2E headless (Chromium)
        run: |
          npx playwright install --with-deps chromium
          (cd _site && python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          CORTAI_URL=http://127.0.0.1:8099/ node tests/e2e.mjs
