# Uma vez só: tira este repositório do GitHub Pages (apaga o site Pages e a branch gh-pages).
name: unpublish-pages
on:
  push:
    branches: [main]
    paths: [.github/workflows/unpublish-pages.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  unpublish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Pages (antes)
        run: gh api "repos/$GITHUB_REPOSITORY/pages" || true
      - name: DELETE /repos/{owner}/{repo}/pages
        run: |
          code=$(curl -s -o resp.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "DELETE pages -> HTTP $code"; cat resp.json 2>/dev/null || true
      - name: Apagar branch gh-pages
        run: |
          code=$(curl -s -o resp.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/gh-pages")
          echo "DELETE refs/heads/gh-pages -> HTTP $code"; cat resp.json 2>/dev/null || true
      - name: Pages (depois)
        run: gh api "repos/$GITHUB_REPOSITORY/pages" || true
